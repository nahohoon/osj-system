<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1a3a5c">
<meta name="description" content="오성정공 금형기반 스마트 생산품질 관리시스템 데모">
<title>오성정공 생산품질 관리시스템</title>
<link rel="manifest" href="https://nahohoon.github.io/osj-system/manifest.json">
<link rel="apple-touch-icon" href="https://nahohoon.github.io/osj-system/icons/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ============================================
   CSS Variables & Reset
   ============================================ */
:root {
  --primary: #1a3a5c;
  --primary-light: #2d5a8e;
  --accent: #e67e22;
  --green: #27ae60;
  --red: #e74c3c;
  --orange: #f39c12;
  --blue: #3498db;
  --teal: #1abc9c;
  --gray: #7f8c8d;
  --bg: #f0f2f5;
  --card-bg: #ffffff;
  --text: #2c3e50;
  --text-muted: #7f8c8d;
  --border: #e0e0e0;
  --sidebar-w: 230px;
  --header-h: 54px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow-x:hidden;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;border:none;background:none;font-family:inherit;}
input,select,textarea{font-family:inherit;}
table{border-collapse:collapse;width:100%;}

/* ============================================
   Header
   ============================================ */
.top-header{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);
  background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;z-index:1000;
  box-shadow:0 2px 8px rgba(0,0,0,0.2);
}
.header-left{display:flex;align-items:center;gap:10px;}
.sidebar-toggle{
  color:#fff;font-size:20px;padding:4px 8px;border-radius:4px;
  background:rgba(255,255,255,0.1);
  min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center;
}
.sidebar-toggle:hover{background:rgba(255,255,255,0.2);}
.brand{display:flex;align-items:center;gap:6px;line-height:1.2;}
.brand-mark{font-size:20px;}
.brand-ko{font-weight:700;font-size:15px;letter-spacing:-0.3px;}
.brand-sub{font-size:11px;opacity:0.75;display:none;}
@media(min-width:600px){.brand-sub{display:inline;}}
.header-right{display:flex;align-items:center;gap:10px;}
.alert-badge{
  background:rgba(231,76,60,0.85);color:#fff;padding:4px 10px;
  border-radius:20px;font-size:12px;font-weight:600;
  animation:blink 1.5s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.6;}}
.today-label{font-size:12px;opacity:0.8;display:none;}
@media(min-width:480px){.today-label{display:inline;}}

/* ============================================
   Sidebar
   ============================================ */
.sidebar{
  position:fixed;top:var(--header-h);left:0;bottom:0;
  width:var(--sidebar-w);background:var(--primary);
  overflow-y:auto;z-index:900;
  transition:transform 0.25s ease;
  display:flex;flex-direction:column;
}
.sidebar.collapsed{transform:translateX(-100%);}
.nav-menu{list-style:none;padding:8px 0;flex:1;}
.nav-section{
  padding:12px 16px 4px;font-size:11px;font-weight:700;
  color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:.8px;
  display:flex;align-items:center;gap:6px;
}
.section-num{
  background:rgba(255,255,255,0.15);color:#fff;
  border-radius:50%;width:18px;height:18px;font-size:10px;
  display:flex;align-items:center;justify-content:center;
}
.nav-item a{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;color:rgba(255,255,255,0.8);
  border-radius:0;transition:all .15s;
  min-height:44px;
}
.nav-item a:hover{background:rgba(255,255,255,0.1);color:#fff;}
.nav-item.active a{
  background:rgba(255,255,255,0.18);color:#fff;font-weight:600;
  border-left:3px solid var(--accent);
}
.nav-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0;}
.nav-text{font-size:13px;}
.badge-red{
  background:var(--red);color:#fff;border-radius:10px;
  font-size:10px;padding:1px 6px;font-weight:700;
}
.sidebar-footer{
  padding:12px 16px;border-top:1px solid rgba(255,255,255,0.1);
  margin-top:auto;
}
.sidebar-version{font-size:11px;color:rgba(255,255,255,0.4);}
.sidebar-concept{font-size:10px;color:rgba(255,255,255,0.3);margin-top:2px;}

/* sidebar overlay (mobile) */
.sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);
  z-index:850;
}
.sidebar-overlay.active{display:block;}

/* ============================================
   Main Content
   ============================================ */
.main-content{
  margin-top:var(--header-h);margin-left:var(--sidebar-w);
  padding:20px;min-height:calc(100vh - var(--header-h));
  transition:margin-left .25s ease;
  padding-bottom:90px;
}
.main-content.expanded{margin-left:0;}
@media(max-width:768px){
  .main-content{margin-left:0;padding:12px;padding-bottom:90px;}
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
}

/* ============================================
   Page Header
   ============================================ */
.page-header{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:16px;flex-wrap:wrap;gap:8px;
}
.page-header h2{font-size:18px;font-weight:700;color:var(--primary);}
.sub-text{font-size:12px;color:var(--text-muted);display:block;margin-top:2px;}

/* ============================================
   Content Header (filter + actions row)
   ============================================ */
.content-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;flex-wrap:wrap;gap:8px;
}
.filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

/* ============================================
   Cards
   ============================================ */
.content-card{background:var(--card-bg);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden;}
.dash-card{background:var(--card-bg);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden;}
.card-header{
  padding:10px 14px;font-size:13px;font-weight:600;
  background:#f8f9fa;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:6px;
}
.card-body{padding:14px;}
.card-body.p0{padding:0;}
.card-footer{
  padding:8px 12px;border-top:1px solid var(--border);
  display:flex;gap:6px;background:#fafafa;
}

/* ============================================
   KPI Cards
   ============================================ */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
@media(min-width:600px){.kpi-grid{grid-template-columns:repeat(4,1fr);}}
.kpi-card{
  background:var(--card-bg);border-radius:8px;padding:14px 12px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
  border-left:4px solid var(--blue);
}
.kpi-card.kpi-blue{border-left-color:var(--blue);}
.kpi-card.kpi-green{border-left-color:var(--green);}
.kpi-card.kpi-red{border-left-color:var(--red);}
.kpi-card.kpi-orange{border-left-color:var(--orange);}
.kpi-card.kpi-teal{border-left-color:var(--teal);}
.kpi-label{font-size:11px;color:var(--text-muted);margin-bottom:4px;}
.kpi-value{font-size:26px;font-weight:700;line-height:1.1;}
.kpi-unit{font-size:11px;color:var(--text-muted);margin-top:2px;}

/* ============================================
   Dashboard Grid
   ============================================ */
.dash-grid2{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px;}
@media(min-width:768px){.dash-grid2{grid-template-columns:1fr 1fr;}}
.dash-grid3{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px;}
@media(min-width:900px){.dash-grid3{grid-template-columns:1fr 1fr 1fr;}}

/* Flow Banner */
.flow-banner{
  background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);
  display:flex;align-items:center;justify-content:center;
  padding:12px 16px;margin-bottom:14px;
  gap:8px;flex-wrap:wrap;
}
.flow-step{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px;}
.flow-icon{font-size:20px;}
.flow-label{font-size:10px;color:var(--text-muted);}
.flow-val{font-size:12px;font-weight:700;}
.flow-arrow{font-size:18px;color:var(--text-muted);}
.step-alert .flow-val,.txt-red{color:var(--red)!important;}
.txt-green{color:var(--green)!important;}
.txt-blue{color:var(--blue)!important;}
.txt-bold{font-weight:700!important;}
.txt-orange{color:var(--orange)!important;}

/* ============================================
   Tables
   ============================================ */
.data-table{width:100%;border-collapse:collapse;font-size:13px;}
.data-table th{
  padding:9px 10px;background:#f4f6fa;font-weight:600;font-size:12px;
  color:#555;text-align:left;border-bottom:2px solid var(--border);
  white-space:nowrap;
}
.data-table td{
  padding:9px 10px;border-bottom:1px solid #f0f0f0;vertical-align:middle;
}
.data-table tr:hover td{background:#fafbff;}
.data-table tr.row-alert td{background:#fff5f5;}
.mini-table{width:100%;border-collapse:collapse;font-size:12px;}
.mini-table th{
  padding:7px 10px;background:#f4f6fa;font-size:11px;font-weight:600;
  color:#555;border-bottom:1px solid var(--border);white-space:nowrap;
}
.mini-table td{padding:7px 10px;border-bottom:1px solid #f5f5f5;vertical-align:middle;}
.mini-table tr:hover td{background:#fafbff;}
.empty-msg{text-align:center;padding:24px;color:var(--text-muted);font-size:13px;}
.table-responsive{overflow-x:auto;-webkit-overflow-scrolling:touch;}

/* ============================================
   Badges
   ============================================ */
.badge{
  display:inline-block;padding:2px 8px;border-radius:10px;
  font-size:11px;font-weight:600;white-space:nowrap;
}
.badge-pass{background:#d4edda;color:#155724;}
.badge-fail{background:#f8d7da;color:#721c24;}
.badge-done{background:#d4edda;color:#155724;}
.badge-ing{background:#cce5ff;color:#004085;}
.badge-plan{background:#fff3cd;color:#856404;}
.badge-cancel{background:#f8d7da;color:#721c24;}
.badge-normal{background:#d4edda;color:#155724;}
.badge-repair{background:#f8d7da;color:#721c24;}
.badge-check{background:#fff3cd;color:#856404;}
.badge-pm{background:#fee2e2;color:#991b1b;}
.badge-prevent{background:#dbeafe;color:#1e40af;}
.badge-urgent{background:#fee2e2;color:#991b1b;}
.badge-routine{background:#dcfce7;color:#166534;}

/* ============================================
   Buttons
   ============================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  padding:7px 14px;border-radius:6px;font-size:13px;font-weight:600;
  transition:all .15s;min-height:36px;border:none;cursor:pointer;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-light);}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{background:#d35400;}
.btn-green{background:var(--green);color:#fff;}
.btn-green:hover{background:#219a52;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-outline:hover{background:#f0f0f0;}
.btn-sm{padding:5px 10px;font-size:12px;min-height:30px;}
.btn-xs{padding:3px 8px;font-size:11px;min-height:26px;border-radius:4px;font-weight:600;}
.btn-xs.btn-blue{background:var(--blue);color:#fff;}
.btn-xs.btn-gray{background:#95a5a6;color:#fff;}
.btn-xs.btn-green{background:var(--green);color:#fff;}
.btn-xs.btn-red{background:var(--red);color:#fff;}
.btn-xs.btn-accent{background:var(--accent);color:#fff;}
.btn-group{display:flex;gap:4px;flex-wrap:wrap;}

/* ============================================
   Forms
   ============================================ */
.form-control{
  width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;
  font-size:13px;background:#fff;color:var(--text);
  transition:border-color .15s;min-height:38px;
}
.form-control:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(52,152,219,.15);}
.form-group{margin-bottom:14px;}
.form-label{display:block;margin-bottom:4px;font-size:12px;font-weight:600;color:#555;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:480px){.form-row{grid-template-columns:1fr;}}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}
.form-card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:20px;}

/* ============================================
   Progress Bar
   ============================================ */
.prog-wrap{height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;display:inline-block;width:80px;}
.prog-bar{height:100%;border-radius:4px;transition:width .3s;}

/* ============================================
   Section Divider
   ============================================ */
.section-divider{
  font-size:13px;font-weight:700;color:var(--primary);
  padding:12px 0 8px;border-bottom:2px solid var(--primary);
  margin-bottom:12px;margin-top:20px;
}

/* ============================================
   Modal
   ============================================ */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);
  z-index:2000;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;
}
.modal-overlay.active{display:flex;}
.modal{
  background:#fff;border-radius:10px;width:100%;max-width:520px;
  box-shadow:0 8px 32px rgba(0,0,0,.2);margin:auto;
}
.modal-header{
  padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-header h3{font-size:16px;font-weight:700;}
.modal-close{font-size:20px;color:var(--text-muted);padding:4px 8px;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:20px;}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}

/* ============================================
   Toast
   ============================================ */
#toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:rgba(44,62,80,0.95);color:#fff;padding:10px 20px;border-radius:20px;
  font-size:13px;z-index:3000;opacity:0;transition:opacity .3s;pointer-events:none;
  white-space:nowrap;
}
#toast.show{opacity:1;}

/* ============================================
   Mobile Bottom Tab
   ============================================ */
.bottom-tab{
  display:none;
  position:fixed;bottom:0;left:0;right:0;height:60px;
  background:#fff;border-top:1px solid var(--border);
  box-shadow:0 -2px 8px rgba(0,0,0,.08);
  z-index:950;
}
.bottom-tab-inner{
  display:flex;height:100%;
}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;font-size:10px;color:var(--text-muted);
  transition:color .15s;padding:4px 0;
  border:none;background:none;cursor:pointer;
}
.tab-btn.active{color:var(--primary);}
.tab-btn .tab-icon{font-size:18px;}
@media(max-width:768px){
  .bottom-tab{display:block;}
  .main-content{padding-bottom:80px;}
}

/* ============================================
   Responsive Table (mobile card view)
   ============================================ */
@media(max-width:600px){
  .data-table thead{display:none;}
  .data-table tr{
    display:block;background:#fff;margin-bottom:8px;
    border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);
    border-left:3px solid var(--blue);
  }
  .data-table tr.row-alert{border-left-color:var(--red);}
  .data-table td{
    display:flex;justify-content:space-between;align-items:center;
    padding:7px 12px;border-bottom:1px solid #f5f5f5;font-size:12px;
  }
  .data-table td::before{
    content:attr(data-label);font-weight:600;color:var(--text-muted);
    font-size:11px;min-width:80px;flex-shrink:0;
  }
  .data-table td:last-child{border-bottom:none;}
}
@media(max-width:600px){
  .mini-table{font-size:12px;}
}

/* ============================================
   Misc
   ============================================ */
.ml-5{margin-left:5px;}
.ml-auto{margin-left:auto;}
canvas{max-width:100%;}
small{font-size:11px;color:var(--text-muted);}
strong{font-weight:700;}
.text-right{text-align:right;}
.text-center{text-align:center;}
.font-mono{font-family:monospace;}
.mt-2{margin-top:8px;}
.hidden{display:none!important;}
</style>
</head>
<body>

<!-- ▶ Toast -->
<div id="toast"></div>

<!-- ▶ Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- ▶ Header -->
<header class="top-header">
  <div class="header-left">
    <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="메뉴">☰</button>
    <span class="brand">
      <span class="brand-mark">⬡</span>
      <span class="brand-ko">오성정공</span>
      <span class="brand-sub">금형기반 스마트 생산품질 관리시스템</span>
    </span>
  </div>
  <div class="header-right">
    <a href="#" class="alert-badge" onclick="navigate('mold-list');return false;" id="pmAlertBadge" style="display:none;">
      🔔 PM 알림 <strong id="pmAlertCount">0</strong>건
    </a>
    <span class="today-label">📅 <span id="todayLabel"></span></span>
  </div>
</header>

<!-- ▶ Sidebar -->
<nav class="sidebar" id="sidebar">
  <ul class="nav-menu">
    <li class="nav-item" data-page="dashboard">
      <a href="#" onclick="navigate('dashboard');return false;">
        <span class="nav-icon">🏠</span><span class="nav-text">스마트 대시보드</span>
      </a>
    </li>
    <li class="nav-section"><span class="section-num">①</span> 생산관리</li>
    <li class="nav-item" data-page="plan-list">
      <a href="#" onclick="navigate('plan-list');return false;">
        <span class="nav-icon">📋</span><span class="nav-text">생산계획</span>
      </a>
    </li>
    <li class="nav-item" data-page="wo-list">
      <a href="#" onclick="navigate('wo-list');return false;">
        <span class="nav-icon">▶</span><span class="nav-text">작업지시</span>
      </a>
    </li>
    <li class="nav-item" data-page="result-list">
      <a href="#" onclick="navigate('result-list');return false;">
        <span class="nav-icon">📊</span><span class="nav-text">생산실적 · LOT</span>
      </a>
    </li>
    <li class="nav-item" data-page="defect-list">
      <a href="#" onclick="navigate('defect-list');return false;">
        <span class="nav-icon">⚠</span><span class="nav-text">불량 등록</span>
      </a>
    </li>
    <li class="nav-section">
      <span class="section-num">②</span> 금형관리
      <span class="badge-red ml-auto hidden" id="sidebarPmBadge">PM 0</span>
    </li>
    <li class="nav-item" data-page="mold-list">
      <a href="#" onclick="navigate('mold-list');return false;">
        <span class="nav-icon">🔩</span><span class="nav-text">금형 현황</span>
        <span class="badge-red ml-auto hidden" id="sidebarPmBadge2">0</span>
      </a>
    </li>
    <li class="nav-item" data-page="maintenance-list">
      <a href="#" onclick="navigate('maintenance-list');return false;">
        <span class="nav-icon">🔧</span><span class="nav-text">정비이력 관리</span>
      </a>
    </li>
    <li class="nav-section"><span class="section-num">③</span> 품질혁신</li>
    <li class="nav-item" data-page="insp-list">
      <a href="#" onclick="navigate('insp-list');return false;">
        <span class="nav-icon">🔍</span><span class="nav-text">순회검사</span>
      </a>
    </li>
    <li class="nav-item" data-page="quality-trend">
      <a href="#" onclick="navigate('quality-trend');return false;">
        <span class="nav-icon">📈</span><span class="nav-text">품질 트렌드 분석</span>
      </a>
    </li>
    <li class="nav-section" style="margin-top:16px;">기준정보</li>
    <li class="nav-item" data-page="product-list">
      <a href="#" onclick="navigate('product-list');return false;">
        <span class="nav-icon">📦</span><span class="nav-text">품목 (치수기준)</span>
      </a>
    </li>
  </ul>
  <div class="sidebar-footer">
    <div class="sidebar-version">v2.0 · 데모 (GitHub Pages)</div>
    <div class="sidebar-concept">금형 → 생산 → 품질 연계</div>
  </div>
</nav>

<!-- ▶ Main Content -->
<main class="main-content" id="mainContent">
  <div id="app"></div>
</main>

<!-- ▶ Mobile Bottom Tab -->

/* ── Storage helpers ── */
function load(key,def){try{const v=localStorage.getItem(key);return v?JSON.parse(v):def;}catch{return def;}}
function save(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch{}}
function getData(key,def){return load('osj_'+key,def);}
function setData(key,val){save('osj_'+key,val);}
function getNextId(arr){return arr.length?Math.max(...arr.map(x=>x.id))+1:1;}

/* ── Initialize default data (only if first visit) ── */
function initData(){
  if(!localStorage.getItem('osj_initialized')){
    setData('products',INIT_PRODUCTS);
    setData('molds',INIT_MOLDS);
    setData('plans',INIT_PLANS);
    setData('wos',INIT_WOS);
    setData('results',INIT_RESULTS);
    setData('defects',INIT_DEFECTS);
    setData('maints',INIT_MAINTS);
    setData('insps',INIT_INSPS);
    localStorage.setItem('osj_initialized','1');
  }
}

/* ── Computed helpers ── */
function getMoldById(id){return getData('molds',INIT_MOLDS).find(m=>m.id===id);}
function getProductById(id){return getData('products',INIT_PRODUCTS).find(p=>p.id===id);}
function getPlanById(id){return getData('plans',INIT_PLANS).find(p=>p.id===id);}
function getWoById(id){return getData('wos',INIT_WOS).find(w=>w.id===id);}
function lifeRate(m){return m.life_shot>0?Math.round(m.current_shot/m.life_shot*100):0;}
function pmRemaining(m){
  const next = Math.ceil(m.current_shot/m.pm_interval)*m.pm_interval;
  return next - m.current_shot;
}
function pmAlert(m){return pmRemaining(m)<=5000;}

/* ============================================
   ROUTING / SPA
   ============================================ */
let currentPage='dashboard';
let chartInstances={};

function destroyCharts(){
  Object.values(chartInstances).forEach(c=>{try{c.destroy();}catch{}});
  chartInstances={};
}

function navigate(page, params={}){
  destroyCharts();
  currentPage=page;
  // update active states
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active',el.dataset.page===page);
  });
  document.querySelectorAll('.tab-btn').forEach(el=>{
    el.classList.toggle('active',el.dataset.page===page);
  });
  // close sidebar on mobile
  if(window.innerWidth<=768) closeSidebar();
  render();
}

function render(){
  const app=document.getElementById('app');
  updatePmAlerts();
  switch(currentPage){
    case 'dashboard': app.innerHTML=renderDashboard(); break;
    case 'plan-list': app.innerHTML=renderPlanList(); break;
    case 'plan-form': app.innerHTML=renderPlanForm(window._editId); break;
    case 'wo-list': app.innerHTML=renderWoList(); break;
    case 'wo-detail': app.innerHTML=renderWoDetail(window._detailId); break;
    case 'result-list': app.innerHTML=renderResultList(); break;
    case 'defect-list': app.innerHTML=renderDefectList(); break;
    case 'mold-list': app.innerHTML=renderMoldList(); break;
    case 'mold-detail': app.innerHTML=renderMoldDetail(window._detailId); break;
    case 'maintenance-list': app.innerHTML=renderMaintenanceList(); break;
    case 'insp-list': app.innerHTML=renderInspList(); break;
    case 'insp-detail': app.innerHTML=renderInspDetail(window._detailId); break;
    case 'quality-trend': app.innerHTML=renderQualityTrend(); break;
    case 'product-list': app.innerHTML=renderProductList(); break;
    default: app.innerHTML=renderDashboard();
  }
  // init charts after render
  requestAnimationFrame(()=>{initPageCharts();});
}

function updatePmAlerts(){
  const molds=getData('molds',INIT_MOLDS);
  const cnt=molds.filter(pmAlert).length;
  const badge=document.getElementById('pmAlertBadge');
  const cnt1=document.getElementById('pmAlertCount');
  const b1=document.getElementById('sidebarPmBadge');
  const b2=document.getElementById('sidebarPmBadge2');
  if(badge){badge.style.display=cnt>0?'':'none'; if(cnt1)cnt1.textContent=cnt;}
  if(b1){b1.classList.toggle('hidden',cnt===0);b1.textContent='PM '+cnt;}
  if(b2){b2.classList.toggle('hidden',cnt===0);b2.textContent=cnt;}
}

/* ============================================
   HELPERS
   ============================================ */
function fmtNum(n){return(n||0).toLocaleString();}
function badgeClass(status){
  const map={'완료':'badge-done','진행':'badge-ing','대기':'badge-plan','취소':'badge-cancel',
    '예정':'badge-plan','PASS':'badge-pass','FAIL':'badge-fail',
    '정상':'badge-normal','수리중':'badge-repair','점검중':'badge-check'};
  return map[status]||'badge-plan';
}
function progColor(rate){
  if(rate>80) return '#e74c3c';
  if(rate>60) return '#f39c12';
  return '#27ae60';
}
function progBar(rate){
  const r=Math.min(rate,100);
  return `<div class="prog-wrap"><div class="prog-bar" style="width:${r}%;background:${progColor(rate)};"></div></div><small>${rate}%</small>`;
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

/* ============================================
   SIDEBAR TOGGLE
   ============================================ */
function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const ov=document.getElementById('sidebarOverlay');
  const mc=document.getElementById('mainContent');
  if(window.innerWidth>768){
    sb.classList.toggle('collapsed');
    mc.classList.toggle('expanded');
  } else {
    sb.classList.toggle('open');
    ov.classList.toggle('active');
  }
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('active');
}

const GAS_BASE_URL='https://script.google.com/macros/s/AKfycbw5IZ7wXy0ssynQegy_MMdeCMMUou2x57hoHzix8A60xfvR_WfkJPmyr3i7IuDmi_Fo/exec';

function buildResultRows(rows){
  if(!rows||!rows.length) return '<tr><td colspan="9" class="empty-msg">생산실적 없음</td></tr>';
  return rows.map(r=>{
    const resultDate = String(r['실적일']||'').slice(0,10);
    const woNo       = r['작업지시']||'-';
    const prodName   = r['품목']||'-';
    const goodQty    = Number(r['양품수량'])||0;
    const badQty     = Number(r['불량수량'])||0;
    const totalQty   = goodQty + badQty;
    const shotCount  = Number(r['금형타수'])||0;
    const worker     = r['작업자']||'-';
    const dr         = totalQty>0?(badQty/totalQty*100).toFixed(2):0;
    return `<tr>
      <td data-label="실적일">${resultDate}</td>
      <td data-label="작업지시"><small>${woNo}</small></td>
      <td data-label="품목">${prodName}</td>
      <td data-label="쳙생산">${fmtNum(totalQty)}</td>
      <td data-label="양품" class="txt-green">${fmtNum(goodQty)}</td>
      <td data-label="불량" class="txt-red">${fmtNum(badQty)}</td>
      <td data-label="불량률" class="${parseFloat(dr)>1?'txt-red':'txt-green'}">${dr}%</td>
      <td data-label="타수">${fmtNum(shotCount)}</td>
      <td data-label="작업자">${worker}</td>
    </tr>`;
  }).join('');
}

// ── JSONP 콜백: Apps Script doGet의 callback 파라미터로 호출됨 ──
// window에 직접 등록하여 JSONP 응답 시 전역에서 호출 가능하도록 함
window.handleProductionResults = function handleProductionResults(response){
  console.log('[생산실적] Google Sheets JSONP 응답:', response);
  console.log('[생산실적] 응답 키 목록:', Object.keys(response||{}));
  console.log('[생산실적] response.success:', response&&response.success);
  console.log('[생산실적] response.data 타입:', response&&typeof response.data, '/ Array?', Array.isArray(response&&response.data));
  if(Array.isArray(response&&response.data)&&response.data.length>0){
    console.log('[생산실적] data[0] 샘플:', response.data[0]);
    console.log('[생산실적] data[0] 키 목록:', Object.keys(response.data[0]));
  }
  // 타임아웃 타이머 해제
  if(window._gasJsonpTimer){
    clearTimeout(window._gasJsonpTimer);
    window._gasJsonpTimer = null;
  }
  // 사용한 script 태그 제거
  const el = document.getElementById('_gasJsonpScript');
  if(el) el.remove();
  try{
    // success 키가 없거나 다른 이름일 경우를 방어: data 배열이 있으면 무조건 렌더
    const rows = Array.isArray(response&&response.data) ? response.data
                : Array.isArray(response&&response.rows) ? response.rows
                : Array.isArray(response)                ? response
                : null;
    console.log('[생산실적] 렌더 대상 rows 길이:', rows?rows.length:'null');
    if(rows && rows.length > 0){
      const sorted = rows.slice().sort((a,b)=>
        String(b['실적일']||'').localeCompare(String(a['실적일']||''))
      );
      const tbody = document.getElementById('resultTbody');
      console.log('[생산실적] resultTbody 탐색 결과:', tbody);
      if(tbody){
        tbody.innerHTML = buildResultRows(sorted);
        console.log('[생산실적] ✅ tbody 렌더 완료, 행 수:', sorted.length);
      } else {
        console.warn('[생산실적] resultTbody를 찾지 못함 → currentPage:', window.currentPage||'알수없음');
      }
    } else {
      console.log('[생산실적] Google Sheets 데이터 없음(rows 비어있음) → localStorage 유지');
    }
  } catch(err){
    console.warn('[생산실적] JSONP 콜백 처리 실패 → localStorage fallback 유지', err);
  }
};

function loadResultsFromSheet(){
  // 기존 script 태그 중복 방지
  const old = document.getElementById('_gasJsonpScript');
  if(old) old.remove();
  if(window._gasJsonpTimer){
    clearTimeout(window._gasJsonpTimer);
    window._gasJsonpTimer = null;
  }

  // 5초 타임아웃: JSONP 응답이 없으면 localStorage 유지
  window._gasJsonpTimer = setTimeout(()=>{
    const el = document.getElementById('_gasJsonpScript');
    if(el) el.remove();

function saveResult(e){
  e&&e.preventDefault();
  const f=e?e.target:document.querySelector('#modals form');
  if(!f)return;
  const results=getData('results',INIT_RESULTS);
  const good=parseInt(f.good_qty.value)||0;
  const defect=parseInt(f.defect_qty.value)||0;
  const woId=parseInt(f.wo_id.value);
  const wo=getWoById(woId)||{};
  const pl=getPlanById(wo.plan_id)||{};
  const prod=getProductById(pl.product_id)||{};
  const obj={
    id:getNextId(results),
    wo_id:woId,
    result_date:f.result_date.value,
    good_qty:good,defect_qty:defect,total_qty:good+defect,
    shot_count:parseInt(f.shot_count.value)||0,
    worker:f.worker.value,remark:f.remark?f.remark.value:''
  };
  // ── 로컬 즉시 반영 ──
  results.unshift(obj);setData('results',results);

  // ── Google Sheets 전송 ──
  // GAS_BASE_URL 전역 상수 사용
  const payload=JSON.stringify({
    action:'saveProductionResult',
    resultDate:f.result_date.value,
    workOrder:wo.wo_no||'',
    product:prod.name||'',
    goodQty:good,
    badQty:defect,
    shotCount:parseInt(f.shot_count.value)||0,
    worker:f.worker.value,
    countType:f.count_type?f.count_type.value:'',
    convertRule:f.convert_rule?f.convert_rule.value:'',
    memo:f.remark?f.remark.value:''
  });

  closeModal();
  showToast('저장 중...');

  fetch(GAS_BASE_URL,{
    method:'POST',
    body:payload
  })
  .then(res=>res.text())
  .then(text=>{
    console.log('GAS 응답:', text);
    showToast('✅ Google Sheets 저장 완료');
    navigate('result-list');
  })
  .catch(err=>{
    console.error('GAS 전송 오류:', err);
    showToast('⚠️ 오류: Google Sheets 저장 실패 (로컬만 저장됨)');
    navigate('result-list');
  });
}

  e&&e.preventDefault();

  if(!f)return;
  const insps=getData('insps',INIT_INSPS);
  const items=(dimItems||[]).map((it,idx)=>{
    const val=parseFloat(f['item_val_'+idx]?.value)||0;
    const res=(val>=it.lsl&&val<=it.usl)?'PASS':'FAIL';
    return {...it,value:val,result:res};

  insps.unshift(obj);setData('insps',insps);closeModal();showToast('순회검사가 등록되었습니다.');navigate('insp-list');
}

  <h2>📈 품질 트렌드 분석</h2>
  <span class="sub-text">금형 수명 상태 × 불량률 상관 분석 · LOT별 품질이력 추적</span>
</div>

<!-- 핵심 분석: 산점도 -->
<div class="dash-card" style="margin-bottom:16px;">
  <div class="card-header" style="background:var(--primary);color:#fff;">
    🔑 핵심 분석 — 금형 수명율 × 불량률 상관관계
    <span style="font-size:11px;font-weight:400;opacity:.8;margin-left:6px;">금형 수명이 높을수록 불량률 증가 여부</span>
  </div>
  <div class="card-body" style="height:260px;"><canvas id="scatterChart"></canvas></div>
</div>

<div class="dash-grid2" style="margin-bottom:16px;">
  <div class="dash-card">
    <div class="card-header">📅 최근 30일 불량 발생 추이</div>
    <div class="card-body" style="height:200px;"><canvas id="trendChart"></canvas></div>
  </div>
  <div class="dash-card">
    <div class="card-header">⚠ 불량 유형별 분포</div>
    <div class="card-body" style="height:200px;">${typeSorted.length?'<canvas id="typeChart"></canvas>':'<div class="empty-msg">데이터 없음</div>'}</div>
  </div>
</div>

<div class="dash-grid2" style="margin-bottom:16px;">
  <div class="dash-card">
    <div class="card-header">📦 품목별 불량 TOP 5</div>
    <div class="card-body" style="height:180px;">${prdTop.length?'<canvas id="prdChart"></canvas>':'<div class="empty-msg">데이터 없음</div>'}</div>
  </div>
  <div class="dash-card">
    <div class="card-header">🔩 금형별 불량 TOP 5</div>
    <div class="card-body" style="height:180px;">${moldTop.length?'<canvas id="moldChart"></canvas>':'<div class="empty-msg">데이터 없음</div>'}</div>
  </div>
</div>

<div class="section-divider">📋 LOT별 품질이력 (최근 20 LOT · 금형 연계)</div>
<div class="content-card">
  <div class="table-responsive">
  <table class="data-table">
    <thead><tr><th>LOT번호</th><th>생산일</th><th>사용금형</th><th>총생산</th><th>불량</th><th>불량률</th><th>판정</th></tr></thead>
    <tbody>
    ${lotHistory.length?lotHistory.map(lot=>`<tr>
      <td><small class="txt-blue">${lot.lot_no}</small></td>
      <td>${lot.date}</td>
      <td><strong>${lot.mold}</strong></td>
      <td>${fmtNum(lot.total)}</td>
      <td class="${lot.defect>0?'txt-red':''}">${lot.defect}</td>
      <td class="${lot.defect_rate>1?'txt-red txt-bold':'txt-green'}">${lot.defect_rate}%</td>
      <td><span class="badge ${lot.defect_rate<=0.5?'badge-pass':lot.defect_rate<=1.0?'badge-plan':'badge-fail'}">${lot.defect_rate<=0.5?'우수':lot.defect_rate<=1.0?'양호':'관리'}</span></td>
    </tr>`).join(''):`<tr><td colspan="7" class="empty-msg">생산실적 데이터가 없습니다.</td></tr>`}
    </tbody>
  </table>
  </div>
</div>

<script>
window._scatter=${JSON.stringify(scatterData)};
window._trend30=${JSON.stringify(trend30)};
window._typeSorted=${JSON.stringify(typeSorted)};
window._prdTop=${JSON.stringify(prdTop)};
window._moldTop=${JSON.stringify(moldTop)};
<\/script>`;
}
function initQualityCharts(){
  const COLORS=['#e74c3c','#e67e22','#f1c40f','#27ae60','#3498db','#9b59b6','#1abc9c','#e91e63'];
  const scatter=window._scatter||[];
  const trend=window._trend30||[];
  const typeSorted=window._typeSorted||[];
  const prdTop=window._prdTop||[];
  const moldTop=window._moldTop||[];

  // 산점도
  const sc=document.getElementById('scatterChart');
  if(sc){
    chartInstances.scatter=new Chart(sc.getContext('2d'),{
      type:'scatter',
      data:{datasets:[{
        label:'금형',
        data:scatter.map(d=>({x:d.x,y:d.y})),
        backgroundColor:scatter.map(d=>d.pm_alert?'rgba(231,76,60,0.85)':'rgba(52,152,219,0.75)'),
        pointRadius:10,pointHoverRadius:13
      }]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:(ctx)=>{
          const d=scatter[ctx.dataIndex];
          return `${d.label} | 수명율: ${d.x}% | 불량률: ${d.y}%`;
        }}}},
        scales:{
          x:{title:{display:true,text:'금형 수명 사용률 (%)'},min:0,max:100},
          y:{title:{display:true,text:'불량률 (%)'},min:0}
        }
      },
      plugins:[{afterDraw:(chart)=>{
        const ctx2=chart.ctx;
        chart.data.datasets[0].data.forEach((pt,i)=>{
          const meta=chart.getDatasetMeta(0).data[i];
          ctx2.fillStyle='#1a3a5c';ctx2.font='bold 10px sans-serif';
          ctx2.fillText(scatter[i].label,meta.x+6,meta.y-6);
        });
      }}]
    });
  }
  // 30일 추이
  const tc=document.getElementById('trendChart');
  if(tc){
    chartInstances.trend=new Chart(tc.getContext('2d'),{
      type:'line',
      data:{labels:trend.map(d=>d.date),datasets:[{label:'불량',data:trend.map(d=>d.count),
        borderColor:'#e74c3c',backgroundColor:'rgba(231,76,60,0.1)',fill:true,tension:0.35,pointRadius:2}]},
      options:{responsive:true,maintainAspectRatio:false,
        scales:{y:{beginAtZero:true}},plugins:{legend:{display:false}}}
    });
  }
  // 유형별
  const tyc=document.getElementById('typeChart');
  if(tyc&&typeSorted.length){
    chartInstances.type=new Chart(tyc.getContext('2d'),{
      type:'doughnut',
      data:{labels:typeSorted.map(d=>d[0]),datasets:[{data:typeSorted.map(d=>d[1]),backgroundColor:COLORS}]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:'right',labels:{font:{size:11}}}}}
    });
  }
  // 품목
  const pc=document.getElementById('prdChart');
  if(pc&&prdTop.length){
    chartInstances.prd=new Chart(pc.getContext('2d'),{
      type:'bar',
      data:{labels:prdTop.map(d=>d[0]),datasets:[{label:'불량수',data:prdTop.map(d=>d[1]),backgroundColor:'rgba(52,152,219,0.75)',borderRadius:4}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}
    });
  }
  // 금형
  const mc=document.getElementById('moldChart');
  if(mc&&moldTop.length){
    chartInstances.mold=new Chart(mc.getContext('2d'),{
      type:'bar',
      data:{labels:moldTop.map(d=>d[0]),datasets:[{label:'불량수',data:moldTop.map(d=>d[1]),backgroundColor:'rgba(231,76,60,0.75)',borderRadius:4}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}
    });
  }
}

/* ============================================
   PAGE: 품목 관리
   ============================================ */
function renderProductList(){
  const products=getData('products',INIT_PRODUCTS);
  return `
<div class="page-header">
  <div><h2>📦 품목 (치수기준)</h2></div>
  <button class="btn btn-accent" onclick="openProductForm()">＋ 품목 등록</button>
</div>
<div class="content-card">
  <div class="table-responsive">
  <table class="data-table">
    <thead><tr><th>품번</th><th>품명</th><th>납품처</th><th>사이클시간</th><th>기준치수</th><th>USL</th><th>LSL</th><th>관리</th></tr></thead>
    <tbody>
    ${products.length?products.map(p=>`<tr>
      <td data-label="품번"><strong>${p.code}</strong></td>
      <td data-label="품명">${p.name}</td>
      <td data-label="납품처">${p.customer}</td>
      <td data-label="사이클">${p.cycle}s</td>
      <td data-label="기준">${p.nominal}</td>
      <td data-label="USL">${p.usl}</td>
      <td data-label="LSL">${p.lsl}</td>
      <td data-label="관리">
        <div class="btn-group">
          <button class="btn-xs btn-blue" onclick="openProductForm(${p.id})">수정</button>
          <button class="btn-xs btn-red" onclick="deleteProduct(${p.id})">삭제</button>
        </div>
      </td>
    </tr>`).join(''):`<tr><td colspan="8" class="empty-msg">등록된 품목이 없습니다.</td></tr>`}
    </tbody>
  </table>
  </div>
</div>`;
}
function openProductForm(editId){
  const products=getData('products',INIT_PRODUCTS);
  const p=editId?products.find(x=>x.id===editId):null;
  const html=`<form onsubmit="saveProduct(event,${editId||'null'})">
    <div class="form-row">
      <div class="form-group"><label class="form-label">품번 *</label><input type="text" class="form-control" name="code" value="${p?p.code:''}" required></div>
      <div class="form-group"><label class="form-label">품명 *</label><input type="text" class="form-control" name="name" value="${p?p.name:''}" required></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">납품처</label><input type="text" class="form-control" name="customer" value="${p?p.customer:'현대자동차'}"></div>
      <div class="form-group"><label class="form-label">단위</label><input type="text" class="form-control" name="unit" value="${p?p.unit:'EA'}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">표준 사이클시간(s)</label><input type="number" class="form-control" name="cycle" value="${p?p.cycle:30}" step="1"></div>
      <div class="form-group"><label class="form-label">기준치수(Nom)</label><input type="number" class="form-control" name="nominal" value="${p?p.nominal:100}" step="0.001"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">USL (상한)</label><input type="number" class="form-control" name="usl" value="${p?p.usl:100.5}" step="0.001"></div>
      <div class="form-group"><label class="form-label">LSL (하한)</label><input type="number" class="form-control" name="lsl" value="${p?p.lsl:99.5}" step="0.001"></div>
    </div>`;
  showModal(editId?'📦 품목 수정':'📦 품목 등록',html,'saveProduct');
  document.querySelector('#modals form').onsubmit=function(e){saveProduct(e,editId);};
}
function saveProduct(e,editId){
  e&&e.preventDefault();
  const f=e?e.target:document.querySelector('#modals form');
  if(!f)return;
  const products=getData('products',INIT_PRODUCTS);
  const obj={
    id:editId||getNextId(products),
    code:f.code.value,name:f.name.value,
    customer:f.customer.value,unit:f.unit.value,
    cycle:parseFloat(f.cycle.value)||30,
    nominal:parseFloat(f.nominal.value)||100,
    usl:parseFloat(f.usl.value)||100.5,
    lsl:parseFloat(f.lsl.value)||99.5
  };
  if(editId){const i=products.findIndex(p=>p.id===editId);products[i]=obj;}
  else products.push(obj);
  setData('products',products);closeModal();showToast(editId?'수정되었습니다.':'품목이 등록되었습니다.');navigate('product-list');
}
function deleteProduct(id){
  if(!confirm('품목을 삭제하시겠습니까?'))return;
  const products=getData('products',INIT_PRODUCTS).filter(p=>p.id!==id);
  setData('products',products);showToast('삭제되었습니다.');navigate('product-list');
}

/* ============================================
   MODAL HELPER
   ============================================ */
function showModal(title,bodyHtml,submitFn){
  const container=document.getElementById('modals');
  container.innerHTML=`
  <div class="modal-overlay active" id="modalOverlay" onclick="handleModalClick(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>${title}</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="closeModal()">취소</button>
        <button type="button" class="btn btn-primary" onclick="submitModal()">저장</button>
      </div>
    </div>
  </div>`;
  window._modalSubmitFn=submitFn;
}
function handleModalClick(e){if(e.target===e.currentTarget)closeModal();}
function closeModal(){
  const c=document.getElementById('modals');
  if(c)c.innerHTML='';
  window._modalSubmitFn=null;
}
function submitModal(){
  const f=document.querySelector('#modals form');
  if(f){
    const evt=new Event('submit',{bubbles:true,cancelable:true});
    f.dispatchEvent(evt);
  }
}
